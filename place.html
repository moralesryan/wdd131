<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Places File</title>
<!--Meta stuff🥱-->
    <meta name="description" content="Place webpage is an interesting page about my country, Costa Rica. I'll give you more reasons to come and visit this wonderful place, trust me!">
    <meta name="author" content="Ryan Morales - WDD131 Week 3 Project">
<!--Let's link it to JS and CSS-->
    <script src="scripts/place.js" defer></script>
    <link rel="stylesheet" href="styles/place.css">
</head>
<body>
    <header>
        <h1>
            Costa Rica
        </h1>
    </header>
    <main>
        <div class="hero"></div>
<!--Hero image = background of the main section-->
            <picture>
                <source media="(max-width: 640px)" srcset="images/monkey-hero.webp" width="auto" height="100%">
                <img src="images/racoon-hero.webp" alt="Costa Rica landscape of a beautiful waterful" width="100%" height="auto">
            </picture>
<!--Data section-->
            <section class="card data">
                <h2>
                    Data
                </h2>
                <p><strong>Area:</strong> 529,334 sq km</p>
                <p><strong>Population:</strong> 5,165,129</p>
                <p><strong>Capital:</strong> San José</p>
                <p><strong>Language:</strong> Spanish</p>
                <p><strong>Currency:</strong> Colón</p>
                <p><strong>Time Zone:</strong> UTC -6</p>
                <p><strong>Calling Code:</strong> +506</p>
            </section>
<!--Weather section-->
            <section class="card weather">
                <h2>
                    Weather
                    <img src="images/weather.svg" alt="Weather logo">
                </h2>
                <p><strong>Temperature:</strong> 20°C</p>
                <p><strong>Conditions:</strong>Sunny</p>
                <p><strong>Wind:</strong> 10km/h</p>
                <p><strong>Wind Chill:</strong> 9.1°C</p>
            </section>
        </div>
    </main>
<footer>
    <p>
        © | Ryan Morales | Costa Rica | <span id="currentyear"></span> 
    </p>
    <p id="lastModified">
    </p>
</footer>
</body>
</html>
