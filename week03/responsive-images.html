<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Images Learning Activity</title>

    <meta name="description" content="Practice for image editing">
    <meta name="author" content="Ryan Morales - WDD131">

    <link rel="stylesheet" href="styles/responsive-images.css">
</head>
<body>
    <main>
        <div class="hero">
            <picture>
                <source media="(min-width: 1000px)" srcset="images/fort-collins-temple.webp" width="1500px" height="750px">
                <source media="(min-width: 500px)" srcset="images/fort-collins-temple.webp" width="1000px" height="500px">
                <img src="images/fort-collins-temple.webp" alt="Picture of the Fort Collins Temple and a beautiful sunset" width="500px" height="250px">
            </picture>
        </div>
    </main>
</body>
</html>
