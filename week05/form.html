<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>

    <meta name="description" content="This file has the purpose of showing my understanding of forms and how to make them user friendluy">
    <meta name="author" content="Ryan Morales">

    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js">defer</script>

</head>
<body>
    <form method="get" action="review.html" class="webform">
        <fieldset>
            <legend>Product Name</legend>
            <select id="product-choice" name="product" required></select>
            <option value="" disabled selected>Select a Product</option>
            <option value="Macbook Air">Macbook Air</option>
            <option value="Iphone">Iphone</option>
            <option value="Ipad">Ipad</option>
            <option value="Air pods">Air pods</option>
            <option value="Apple Watch">Apple Watch</option>
        </fieldset>
        <fieldset>
            <label>Overall Ratings</label>
            <div class="stars">
                <input type="radio" id="fivestar" name="stars" value="5" required><label for=fivestar></label>
                <input type="radio" id="fourstar" name="stars" value="4" required><label for=fourstar></label>
                <input type="radio" id="threestar" name="stars" value="3" required><label for=threestar></label>
                <input type="radio" id="twostar" name="stars" value="2" required><label for=twostar></label>
                <input type="radio" id="onestar" name="stars" value="1" required><label for=onestar></label>
            </div>
        </fieldset>
        <fieldset>
            <label>Date of Installation</label>
            <input type="date" id="date" name="installationDate" required>
        </fieldset>
    </form>
    
</body>
</html>
